<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes">
<title>課金AI 発表スライド</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 白い紙の上に、コードで作った3Dの物体が浮かぶ。文字は最小限・極太 */
:root{
  --paper:#ffffff; --ink:#14161b; --mute:#8b919c; --line:#e7e9ee;
  --gold:#f5b300; --coral:#ff4b3e; --teal:#11b3a6; --blue:#3a66ff;
  --display:"Dela Gothic One","Hiragino Sans","Noto Sans JP",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;background:var(--paper);color:var(--ink);overflow:hidden;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
body{font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#wrap{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper)}
#stage{position:relative;width:1600px;height:900px;transform-origin:center;flex:none;overflow:hidden;background:var(--paper)}
#gl{position:absolute;inset:0;width:1600px;height:900px}
.s{position:absolute;inset:0;pointer-events:none;visibility:hidden}
.s.on{visibility:visible}
.a{opacity:0;transform:translateY(40px);transition:opacity .7s cubic-bezier(.2,.8,.2,1),transform 1s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.s.on .a{opacity:1;transform:none}
[data-step]{opacity:0;transform:translateY(40px) scale(.96);transition:opacity .6s cubic-bezier(.2,.8,.2,1),transform .9s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
[data-step].show{opacity:1;transform:none}
.abs{position:absolute}
.disp{font-family:var(--display);font-weight:400;line-height:1;letter-spacing:.01em}
.lbl{font-weight:700;color:var(--mute);font-size:30px;letter-spacing:.08em}

/* タイトル */
.title-big{left:120px;top:250px;font-size:250px}
.title-big span{display:inline-block;opacity:0;transform:translateY(120px) rotate(8deg);transition:opacity .6s,transform 1.1s cubic-bezier(.2,1.4,.3,1);transition-delay:calc(var(--i)*.09s + .2s)}
.s.on .title-big span{opacity:1;transform:none}
.title-sub{left:132px;top:560px;font-size:64px;line-height:1.35}
.title-sub em{font-style:normal;color:var(--coral)}
.names{left:136px;top:760px;font-size:30px;font-weight:700;color:var(--mute);letter-spacing:.1em}

/* AIの種類 */
.ai-l{width:320px;margin-left:-160px;text-align:center}
.ai-l b{display:block;font-family:var(--display);font-size:46px;font-weight:400}
.ai-l small{display:block;font-size:26px;font-weight:700;color:var(--mute);margin-top:10px;letter-spacing:.06em}
.new{position:absolute;font-family:var(--display);font-size:26px;color:#fff;background:var(--coral);padding:8px 16px;border-radius:40px;transform:rotate(8deg)}

/* 値段 */
.price{left:720px;top:290px}
.price .lbl{font-size:40px}
.price .yen{font-family:var(--display);font-size:180px;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.price .per{font-family:var(--display);font-size:64px;color:var(--mute)}

/* 漢字補習室 */
.kj{left:860px;top:250px}
.kj .disp{font-size:300px}
.kj .disp small{font-size:90px;margin-left:10px}

/* 実演の結果 */
.stats{left:930px;top:150px;display:grid;gap:26px}
.stat{display:flex;align-items:baseline;gap:20px}
.stat .disp{font-size:150px;font-variant-numeric:tabular-nums}
.stat .u{font-family:var(--display);font-size:56px}
.stat.c .disp,.stat.c .u{color:var(--teal)}
.stamp{left:1150px;top:630px;font-family:var(--display);font-size:92px;color:var(--coral);border:9px solid var(--coral);border-radius:18px;padding:6px 30px 14px;transform:rotate(-12deg) scale(2.4);opacity:0;transition:none}
.stamp.show{animation:slam .45s cubic-bezier(.3,1.6,.4,1) forwards}
@keyframes slam{0%{opacity:0;transform:rotate(-12deg) scale(2.4)}100%{opacity:1;transform:rotate(-12deg) scale(1)}}

/* 取り残される */
.left{left:0;right:0;top:120px;text-align:center;font-size:84px}

/* 課金ボタン */
.btn-sub{left:0;right:0;top:700px;text-align:center;font-size:34px;font-weight:700;color:var(--mute);letter-spacing:.2em}
.cursor{left:1400px;top:820px;width:70px;transition:left 1.4s cubic-bezier(.6,0,.2,1),top 1.4s cubic-bezier(.6,0,.2,1),transform .15s}
.s.on .cursor{left:900px;top:470px}
.cursor.press{transform:scale(.8)}

/* 種明かし */
.reveal{left:0;right:0;top:390px;text-align:center;font-size:72px}
.caret{display:inline-block;width:.08em;height:1em;background:var(--ink);vertical-align:-.12em;margin-left:.06em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* 共通 */
/* 種明かし：暗転してから、黒い画面に白い文字 */
#stage{transition:background-color 1.2s ease}
#stage.dark{background:#000}
#stage.dark .reveal{color:#fff}
#stage.dark .caret{background:#fff}
html.rec #stage{transition:none}
#sponsor{position:absolute;right:40px;bottom:28px;font-size:24px;font-weight:700;color:var(--mute);letter-spacing:.04em;transition:color .6s}
#sponsor.hot{color:var(--coral)}
#bar{position:absolute;left:0;bottom:0;height:6px;background:var(--ink);transition:width .6s cubic-bezier(.2,.8,.2,1)}
#fs{position:fixed;right:max(12px,env(safe-area-inset-right,0px));top:max(12px,env(safe-area-inset-top,0px));font:700 14px var(--body);color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:20px;padding:6px 12px;opacity:.5;cursor:pointer}
html.rec .names,html.rec #fs,html.rec #bar{display:none}
#fs:hover,#fs:focus-visible{opacity:1;outline:2px solid var(--blue)}
@media (prefers-reduced-motion:reduce){.a,[data-step],.title-big span{transition-duration:.01s!important}}
</style></head><body>

<div id="wrap"><div id="stage">
  <canvas id="gl"></canvas>

  <section class="s" data-name="title">
    <div class="abs disp title-big"><span style="--i:0">課</span><span style="--i:1">金</span><span style="--i:2">A</span><span style="--i:3">I</span></div>
    <div class="abs disp title-sub a" style="--d:.8s">すごく価値がある、<br>でも<em>危ない</em></div>
    <div class="abs names a" style="--d:1.1s">発表　○○ ・ ○○</div>
  </section>

  <section class="s" data-name="types">
    <div class="abs ai-l a" data-x="-6.3" data-y="-2.1" style="--d:.5s"><b>ChatGPT</b><small>OpenAI</small></div>
    <div class="abs ai-l a" data-x="-2.1" data-y="-2.1" style="--d:.62s"><b>Gemini</b><small>Google</small></div>
    <div class="abs ai-l a" data-x="2.1" data-y="-2.1" style="--d:.74s"><b>Claude</b><small>Anthropic</small></div>
    <div class="abs ai-l a" data-x="6.3" data-y="-2.1" style="--d:.86s"><b>Muse</b><small>Meta</small></div>
    <div class="new a" data-x="7.6" data-y="2.2" style="--d:1.3s">NEW 2026.9</div>
  </section>

  <section class="s" data-name="price">
    <div class="abs price">
      <div class="lbl a" style="--d:.5s">課金AI　月額　約</div>
      <div class="yen a" style="--d:.6s">¥<span id="yen">0</span></div>
      <div class="per a" style="--d:.9s">／月</div>
    </div>
  </section>

  <section class="s" data-name="kanji">
    <div class="abs kj">
      <div class="lbl a" style="--d:.6s">漢字補習室　土台ができるまで</div>
      <div class="disp" data-step="1">1<small>日</small></div>
    </div>
  </section>

  <section class="s" data-name="demo">
    <div class="abs stats">
      <div class="stat c" data-step="1" style="--d:1.4s"><span class="disp" id="score">0</span><span class="u">点</span></div>
      <div class="stat" data-step="1" style="--d:1.7s"><span class="disp">数</span><span class="u">秒</span></div>
      <div class="stat" data-step="1" style="--d:2s"><span class="disp">0</span><span class="u">問 読んだ</span></div>
    </div>
    <div class="abs stamp" data-step="2">提出済</div>
  </section>

  <section class="s" data-name="behind">
    <div class="abs disp left" data-step="1" style="--d:1.6s">ついていけないと、<br>取り残される。</div>
  </section>

  <section class="s" data-name="button">
    <div class="abs btn-sub a" style="--d:.7s">あなたの代わりに考えます</div>
    <svg class="abs cursor" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 2l15 9-6.5 1.6L16 20l-3 1.4-3.4-7.3L4 18z" fill="#14161b" stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>
  </section>

  <section class="s" data-name="reveal">
    <div class="abs disp reveal"><span id="typed"></span><span class="caret"></span></div>
  </section>

  <div id="sponsor">※この発表は、月額プランの提供でお送りしています</div>
  <div id="bar"></div>
</div></div>
<button id="fs" type="button">全画面</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const stage=document.getElementById('stage'), canvas=document.getElementById('gl');
const W=1600,H=900, CAMZ=20, FOV=30;
const PX=H/(2*CAMZ*Math.tan(FOV/2*Math.PI/180)); // 1ユニットのピクセル数（z=0）
const C={gold:0xf5b300, coral:0xff4b3e, teal:0x11b3a6, blue:0x3a66ff, ink:0x14161b, white:0xf7f8fa, violet:0x8a7bff};

/* ---------- 画面サイズ ---------- */
let scale=1;
function fit(){
  scale=Math.min(innerWidth/W, innerHeight/H);
  stage.style.transform='scale('+scale+')';
  if(R){R.setPixelRatio(Math.min(2.5, scale*(devicePixelRatio||1))); R.setSize(W,H,false);}
}
/* ---------- three.js ---------- */
const R=new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
R.outputEncoding=THREE.sRGBEncoding; R.toneMapping=THREE.ACESFilmicToneMapping; R.toneMappingExposure=.95;
R.shadowMap.enabled=true; R.shadowMap.type=THREE.VSMShadowMap;
fit(); addEventListener('resize',fit);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(FOV, W/H, .1, 100); cam.position.set(0,0,CAMZ);

// 映り込み用の簡単なスタジオ
(function(){
  const pm=new THREE.PMREMGenerator(R), s=new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.BoxGeometry(30,30,30), new THREE.MeshBasicMaterial({color:0x9aa1ad, side:THREE.BackSide})));
  const panel=(k,x,y,z,w,h)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({color:new THREE.Color(1,1,1).multiplyScalar(k), side:THREE.DoubleSide})); m.position.set(x,y,z); m.lookAt(0,0,0); s.add(m);};
  panel(6,0,14,0,18,18); panel(3,-14,3,6,8,12); panel(2,14,2,4,6,10); panel(2.5,0,4,14,16,6);
  scene.environment=pm.fromScene(s,.04).texture;
})();
scene.add(new THREE.HemisphereLight(0xffffff,0xdfe4ec,.55));
const key=new THREE.DirectionalLight(0xffffff,1.5); key.position.set(-6,9,14); key.castShadow=true;
key.shadow.mapSize.set(2048,2048); key.shadow.radius=14; key.shadow.bias=-.0005;
Object.assign(key.shadow.camera,{left:-15,right:15,top:11,bottom:-11,near:1,far:60}); scene.add(key);
const fill=new THREE.DirectionalLight(0xffffff,.35); fill.position.set(9,-3,10); scene.add(fill);
const wall=new THREE.Mesh(new THREE.PlaneGeometry(80,50), new THREE.ShadowMaterial({opacity:.13}));
wall.position.z=-3; wall.receiveShadow=true; scene.add(wall);

/* ---------- 小道具 ---------- */
const now=()=>window.__VT!=null?window.__VT:performance.now()/1000;
// 録画のとき：ふわふわの動きを周期 __LOOPL 秒にそろえる（ループ動画のつなぎ目が見えないように）
const w=f=>{const L=window.__LOOPL;return L?Math.max(1,Math.round(f*L/(2*Math.PI)))*2*Math.PI/L:f;};
const E={out:p=>1-Math.pow(1-p,3), inOut:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2, in:p=>p*p*p,
  back:p=>{const c=1.70158,c3=c+1;return 1+c3*Math.pow(p-1,3)+c*Math.pow(p-1,2);},
  elastic:p=>p===0||p===1?p:Math.pow(2,-10*p)*Math.sin((p*10-.75)*(2*Math.PI)/3)+1};
let tweens=[];
function tw(dur,fn,o){o=o||{};const t={t0:now()+(o.delay||0),dur,fn,ease:o.ease||E.out,done:o.done,tag:o.tag};tweens.push(t);return t;}
const lerp=(a,b,p)=>a+(b-a)*p;

const lin=h=>new THREE.Color(h).convertSRGBToLinear();
function mat(color,o){return new THREE.MeshPhysicalMaterial(Object.assign({color:lin(color), roughness:.3, metalness:0, clearcoat:1, clearcoatRoughness:.15, envMapIntensity:.55},o||{}));}
const gold=()=>mat(C.gold,{metalness:.8,roughness:.22,clearcoat:.6,envMapIntensity:1.1});
const geoCache={};
function rbox(w,h,d,r,bev){
  const k=[w,h,d,r,bev].join(); if(geoCache[k]) return geoCache[k];
  bev=bev==null?Math.min(.12,d/3):bev;
  const s=new THREE.Shape(),x=-w/2+bev,y=-h/2+bev,ww=w-2*bev,hh=h-2*bev,q=Math.max(.001,r-bev);
  s.moveTo(x+q,y);s.lineTo(x+ww-q,y);s.quadraticCurveTo(x+ww,y,x+ww,y+q);s.lineTo(x+ww,y+hh-q);s.quadraticCurveTo(x+ww,y+hh,x+ww-q,y+hh);
  s.lineTo(x+q,y+hh);s.quadraticCurveTo(x,y+hh,x,y+hh-q);s.lineTo(x,y+q);s.quadraticCurveTo(x,y,x+q,y);
  const g=new THREE.ExtrudeGeometry(s,{depth:Math.max(.001,d-2*bev),bevelEnabled:true,bevelThickness:bev,bevelSize:bev,bevelSegments:6,curveSegments:14});
  g.center(); return geoCache[k]=g;
}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.anisotropy=8;return t;}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
const imgs={};
function loadImg(src){return imgs[src]||(imgs[src]=new Promise(ok=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>ok(null);i.src=src;}));}
function plane(w,h,tex){return new THREE.Mesh(new THREE.PlaneGeometry(w,h), new THREE.MeshBasicMaterial({map:tex,transparent:true,toneMapped:false}));}
function shade(o){o.traverse(m=>{if(m.isMesh){m.castShadow=true;}});return o;}

// コインの面（¥の刻印）
let coinFaceTex;
function coinFace(){return coinFaceTex||(coinFaceTex=canvasTex(512,512,(x,w)=>{
  const g=x.createRadialGradient(200,180,20,256,256,256);g.addColorStop(0,'#ffe27a');g.addColorStop(.7,'#f5b300');g.addColorStop(1,'#d48f00');
  x.fillStyle=g;x.fillRect(0,0,w,w);
  x.lineWidth=18;x.strokeStyle='rgba(160,100,0,.45)';x.beginPath();x.arc(256,256,212,0,7);x.stroke();
  x.font='900 300px "Zen Kaku Gothic New", "Hiragino Sans", sans-serif';x.textAlign='center';x.textBaseline='middle';
  x.fillStyle='rgba(150,90,0,.55)';x.fillText('¥',262,282);x.fillStyle='#fff1b8';x.fillText('¥',252,270);
}),coinFaceTex.center.set(.5,.5),coinFaceTex.rotation=window.__COINROT==null?Math.PI/2:window.__COINROT,coinFaceTex);}
function coin(r){
  const side=gold(), face=new THREE.MeshPhysicalMaterial({map:coinFace(),metalness:.55,roughness:.28,clearcoat:.6,envMapIntensity:1.2});
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,r*.18,72),[side,face,face]);
  m.rotation.x=Math.PI/2; const g=new THREE.Group(); g.add(m); return shade(g);
}

/* ---------- スライド ---------- */
const parallax={x:0,y:0,tx:0,ty:0};
const S=[];
function def(name,o){o.name=name;o.steps=o.steps||0;S.push(o);}

def('title',{
  enter(g){
    const spots=[[3.4,2.6,1.3],[6.6,3.2,.9],[8,.6,1.5],[5.2,-.4,.7],[2.4,-2.6,.8],[7.6,-2.9,1.1],[-7.8,3.9,.55],[.6,4.2,.45],[4.6,-4.1,.5],[9.2,-1.2,.55],[-1.2,-4,.6]];
    spots.forEach((s,i)=>{
      const c=coin(s[2]); c.position.set(s[0],s[1]+12,lerp(-1,1.5,(i%4)/3));
      c.userData={bx:s[0],by:s[1],ph:i*1.7,sp:.4+.25*(i%3),tilt:.4+(i%5)*.12}; g.add(c);
      tw(1.6,p=>{c.position.y=lerp(s[1]+12,s[1],p);},{delay:.15+i*.07,ease:E.elastic});
    });
  },
  tick(t,g){g.children.forEach(c=>{const u=c.userData;c.rotation.y=t*w(u.sp)+u.ph;c.rotation.x=Math.sin(t*w(.7)+u.ph)*u.tilt;c.position.x=u.bx+Math.sin(t*w(.5)+u.ph)*.12;});}
});

def('types',{
  enter(g){
    const icons=['chatgpt','gemini','claude','muse'];
    icons.forEach((n,i)=>{
      const t=new THREE.Group(), x=-6.3+i*4.2;
      const body=new THREE.Mesh(rbox(2.9,2.9,.6,.68),mat(0xffffff)); t.add(body);
      loadImg('img/'+n+'.png').then(im=>{
        if(!im) return;
        let edge='#ffffff';
        const tex=canvasTex(512,512,(x)=>{x.save();rr(x,0,0,512,512,118);x.clip();x.drawImage(im,-14,-14,540,540);x.restore();
          const d=x.getImageData(256,8,1,1).data; edge='rgb('+d[0]+','+d[1]+','+d[2]+')';});
        body.material.color.set(edge).convertSRGBToLinear();
        const f=plane(2.9,2.9,tex); f.position.z=.302; t.add(f);
      });
      t.position.set(x,.9,0); t.scale.setScalar(.001); t.userData={ph:i*1.3,x};
      tw(1.1,p=>{t.scale.setScalar(Math.max(.001,p));t.rotation.y=lerp(-Math.PI*1.5,0,p);},{delay:.2+i*.13,ease:E.back});
      g.add(shade(t));
    });
  },
  tick(t,g){g.children.forEach((c,i)=>{c.position.y=.9+Math.sin(t*w(1.2)+c.userData.ph)*.15;c.rotation.x=Math.sin(t*w(.8)+c.userData.ph)*.06-parallax.y*.25;c.rotation.z=Math.sin(t*w(.6)+c.userData.ph)*.03;if(t>2)c.rotation.y=parallax.x*.35+Math.sin(t*w(.5)+c.userData.ph)*.08;});}
});

def('price',{
  enter(g){
    const c=coin(3); c.position.set(-4.8,0,-30); g.add(c);
    tw(1.8,p=>{c.position.z=lerp(-30,0,p);c.rotation.y=lerp(Math.PI*7,0,p);},{ease:E.out,delay:.1});
    // 小さいコインが周りを回る
    for(let i=0;i<7;i++){const s=coin(.45);s.userData={a:i/7*Math.PI*2,r:3.6+(i%2)*.4};s.scale.setScalar(.001);g.add(s);
      tw(.8,p=>s.scale.setScalar(Math.max(.001,p)),{delay:1.4+i*.08,ease:E.back});}
    const el=document.getElementById('yen'); el.textContent='0';
    tw(1.4,p=>{el.textContent=Math.round(3000*p).toLocaleString();},{delay:.8,tag:'ui'});
  },
  tick(t,g){const [big,...sm]=g.children; if(t>1.9) big.rotation.y=Math.sin((t-1.9)*w(.9))*.5;
    big.rotation.x=Math.sin(t*w(.6))*.08;
    sm.forEach((s,i)=>{const u=s.userData,a=u.a+t*w(.45);s.position.set(-4.8+Math.cos(a)*u.r,Math.sin(a)*u.r*.55,Math.sin(a)*1.6+.5);s.rotation.y=t*w(1.5)+i;});}
});

def('kanji',{steps:1,
  enter(g){
    const t=new THREE.Group();
    t.add(new THREE.Mesh(rbox(3.62,6.1,.32,.55),mat(0x1b1d22,{roughness:.25})));
    loadImg('img/kanji-phone.jpg').then(im=>{if(!im)return;
      const tex=canvasTex(780,1328,(x)=>{x.save();rr(x,0,0,780,1328,84);x.clip();x.drawImage(im,0,0,780,1328);x.restore();});
      const f=plane(3.38,5.76,tex); f.position.z=.162; t.add(f);});
    t.position.set(-3.4,-12,0); t.rotation.set(-.06,.3,.03); g.add(shade(t));
    tw(1.6,p=>{t.position.y=lerp(-12,-.1,p);t.rotation.y=lerp(1.6,.28,p);},{ease:E.out,delay:.1});
    // 浮かぶ筆（ペン）
    const pen=new THREE.Group();
    const body=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,3.4,32),mat(C.coral)); pen.add(body);
    const tip=new THREE.Mesh(new THREE.ConeGeometry(.16,.5,32),mat(0xf3e6cf,{clearcoat:0})); tip.position.y=-1.95; pen.add(tip);
    const nib=new THREE.Mesh(new THREE.ConeGeometry(.055,.17,24),mat(C.ink)); nib.position.y=-2.17; pen.add(nib);
    pen.position.set(.2,8,1.6); pen.rotation.z=.6; g.add(shade(pen)); pen.userData.pen=1;
    tw(1.4,p=>{pen.position.y=lerp(8,.9,p);},{delay:.8,ease:E.back});
  },
  step(n,g){},
  tick(t,g){const [tab,pen]=g.children; if(t>1.7){tab.rotation.y=.28+Math.sin((t-1.7)*w(.5))*.06-parallax.x*.2;tab.rotation.x=-.06+parallax.y*.1;}
    if(pen&&t>2.2){pen.position.x=.2+Math.sin(t*w(2.2))*.35;pen.position.y=.9+Math.sin(t*w(4.4))*.18;pen.rotation.z=.6+Math.sin(t*w(2.2))*.08;}}
});

let tileFront,tileBack;
def('demo',{steps:2,
  enter(g){
    tileFront=tileFront||canvasTex(256,256,(x)=>{x.fillStyle='#fff';x.fillRect(0,0,256,256);x.fillStyle='#c5cad3';x.font='900 120px "Zen Kaku Gothic New",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('?',128,138);});
    tileBack=tileBack||canvasTex(256,256,(x)=>{x.fillStyle='#11b3a6';x.fillRect(0,0,256,256);x.strokeStyle='#fff';x.lineWidth=30;x.lineCap='round';x.lineJoin='round';x.beginPath();x.moveTo(70,134);x.lineTo(112,176);x.lineTo(190,88);x.stroke();});
    const geo=rbox(.86,.86,.2,.18,.06);
    for(let i=0;i<31;i++){
      const col=i%7,row=Math.floor(i/7), t=new THREE.Group();
      const body=new THREE.Mesh(geo,mat(0xffffff)); t.add(body);
      const f=new THREE.Mesh(new THREE.PlaneGeometry(.7,.7),new THREE.MeshStandardMaterial({map:tileFront,roughness:.4})); f.position.z=.101; t.add(f);
      const b=new THREE.Mesh(new THREE.PlaneGeometry(.7,.7),new THREE.MeshStandardMaterial({map:tileBack,roughness:.4})); b.position.z=-.101; b.rotation.y=Math.PI; t.add(b);
      t.position.set(-7.6+col*1.0,2.3-row*1.0,0); t.scale.setScalar(.001);
      t.userData={i,col,row,flip:0,body}; g.add(shade(t));
      tw(.6,p=>t.scale.setScalar(Math.max(.001,p)),{delay:.15+(col+row)*.05,ease:E.back});
    }
    document.getElementById('score').textContent='0';
  },
  step(n,g){
    if(n===1){
      g.children.forEach(t=>{const u=t.userData;
        tw(.5,p=>{t.rotation.y=lerp(0,Math.PI,p);t.position.z=Math.sin(p*Math.PI)*.8;
          if(p>.5) u.body.material.color.copy(lin(C.teal));},{delay:.1+u.i*.035,ease:E.inOut});});
      const el=document.getElementById('score');
      tw(.9,p=>{el.textContent=Math.round(100*p);},{delay:1.5});
    }
  },
  tick(t,g){g.rotation.y=-.08+parallax.x*.12;g.rotation.x=parallax.y*.08;}
});

def('behind',{steps:1,
  enter(g){
    const cols=[C.blue,C.blue,C.gold,C.teal,C.coral,C.violet,C.blue,C.teal,C.gold];
    const bodyG=new THREE.SphereGeometry(.5,40,32), headG=new THREE.SphereGeometry(.36,40,32);
    cols.forEach((c,i)=>{
      const p=new THREE.Group(), m=mat(c);
      const b=new THREE.Mesh(bodyG,m); b.scale.set(.9,1.25,.9); b.position.y=.62; p.add(b);
      const h=new THREE.Mesh(headG,m); h.position.y=1.72; p.add(h);
      p.position.set(-7.4+i*1.75,-3.1,0); p.scale.setScalar(1.25);
      p.userData={i,ph:i*.9,go:0,x0:-7.4+i*1.75,head:h,body:b,speed:0}; p.visible=true; g.add(shade(p));
      p.position.y=-12; tw(1,q=>p.position.y=lerp(-12,-3.1,q),{delay:.1+i*.06,ease:E.back});
    });
  },
  step(n,g){
    g.children.forEach(p=>{const u=p.userData; if(u.i===0){
      const m=u.body.material,a=m.color.clone(),b=lin(0xc9cdd4);tw(1.4,q=>m.color.copy(a).lerp(b,q),{delay:1.2});
      tw(1.2,q=>{u.head.position.y=lerp(1.72,1.5,q);u.head.position.z=lerp(0,.22,q);p.rotation.z=lerp(0,.06,q);},{delay:2});
      return;}
      u.go=now()+(u.i-1)*.06;});
  },
  tick(t,g){
    g.children.forEach(p=>{const u=p.userData;
      const walking=u.i!==0 || !this._stepped;
      const ph=t*w(7)+u.ph;
      if(u.go){const e=Math.max(0,now()-u.go); p.position.x=u.x0+(e<1.2?2.5*e*e:3.6+6*(e-1.2));}
      p.position.y=-3.1+(walking&&t>1?Math.abs(Math.sin(ph))*.18:0);
      p.rotation.z=walking&&t>1?Math.sin(ph)*.06:p.rotation.z;
    });
  }
});

def('button',{steps:1,
  enter(g){
    const base=new THREE.Mesh(rbox(10.4,3.6,.5,1.8),mat(0xffffff)); base.position.set(0,.5,-.5); g.add(base);
    const top=new THREE.Group();
    const cap=new THREE.Mesh(rbox(9.4,2.7,1,1.35,.3),mat(C.coral,{roughness:.22})); top.add(cap);
    document.fonts.load('400 100px "Dela Gothic One"').then(()=>{
      const tex=canvasTex(1880,540,(x,w,h)=>{x.fillStyle='#fff';x.font='400 230px "Dela Gothic One","Zen Kaku Gothic New",sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText('今すぐ課金する',w/2,h/2+14);});
      const f=plane(9.4,2.7,tex); f.position.z=.502; top.add(f);
    });
    top.position.set(0,.5,.4); g.add(top); shade(g);
    g.scale.setScalar(.001); tw(1,p=>g.scale.setScalar(Math.max(.001,p)),{ease:E.back,delay:.1});
    g.userData.top=top;
  },
  step(n,g){
    const cur=document.querySelector('.cursor'); cur.classList.add('press');
    const top=g.userData.top;
    tw(.12,p=>top.position.z=lerp(.4,-.05,p),{ease:E.in,done(){cur.classList.remove('press');tw(.6,p=>top.position.z=lerp(-.05,.4,p),{ease:E.elastic});}});
  },
  tick(t,g){g.rotation.x=-.28+Math.sin(t*w(.8))*.04+parallax.y*.12;g.rotation.y=Math.sin(t*w(.6))*.06+parallax.x*.2;
    if(g.userData.top&&!g.userData.pressed) g.userData.top.scale.setScalar(1+Math.max(0,Math.sin(t*w(3)))*.015);}
});

def('reveal',{
  enter(){
    const el=document.getElementById('typed'), txt='この発表は、すべてAIによる台本です。'; el.textContent='';
    let i=0; tw(txt.length*.11,p=>{const n=Math.round(txt.length*p);if(n!==i){i=n;el.textContent=txt.slice(0,n);}},{delay:1.4,ease:p=>p,tag:'ui'});
    document.getElementById('sponsor').classList.add('hot'); stage.classList.add('dark');
  },
  leave(){document.getElementById('sponsor').classList.remove('hot'); stage.classList.remove('dark');}
});

/* ---------- 進行 ---------- */
const secs=[...document.querySelectorAll('.s')];
secs.forEach(s=>s.querySelectorAll('[data-x]').forEach(el=>{
  el.style.left=(800+parseFloat(el.dataset.x)*PX)+'px'; el.style.top=(450-parseFloat(el.dataset.y)*PX)+'px';}));
let cur=-1, step=0, group=null, t0=0;
function show(i){
  if(i<0||i>=S.length) return;
  const prev=S[cur];
  if(prev&&prev.leave) prev.leave();
  if(group){const old=group; old.children.forEach((c,k)=>{const s0=c.scale.x;tw(.35,p=>c.scale.setScalar(Math.max(.001,s0*(1-p))),{ease:E.in,delay:k*.01});});
    if(!old.children.length||window.__REC) scene.remove(old); else setTimeout(()=>scene.remove(old),700);}
  tweens=tweens.filter(t=>t.tag!=='ui');
  cur=i; step=0; t0=now(); S[i]._stepped=false;
  secs.forEach(s=>{const on=s.dataset.name===S[i].name; s.classList.toggle('on',on);
    s.querySelectorAll('[data-step]').forEach(e=>e.classList.remove('show'));});
  group=new THREE.Group(); scene.add(group); S[i].enter(group);
  document.getElementById('bar').style.width=((i+1)/S.length*100)+'%';
  try{history.replaceState(null,'','#s'+(i+1));}catch(e){}
}
function next(){const s=S[cur]; if(step<s.steps){step++; s._stepped=true;
    document.querySelector('.s.on').querySelectorAll('[data-step="'+step+'"]').forEach(e=>e.classList.add('show'));
    if(s.step) s.step(step,group);} else show(cur+1);}
function prev(){ if(step>0){show(cur);} else show(cur-1);}

addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();next();}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(e.key)){e.preventDefault();prev();}
  else if(e.key==='f') toggleFs();
});
let sx=null;
document.getElementById('wrap').addEventListener('pointerdown',e=>{sx=e.clientX;});
document.getElementById('wrap').addEventListener('pointerup',e=>{
  if(sx===null) return; const dx=e.clientX-sx; sx=null;
  if(dx>60) return prev(); if(dx<-60) return next();
  if(e.clientX<innerWidth*.2) prev(); else next();
});
addEventListener('pointermove',e=>{parallax.tx=(e.clientX/innerWidth-.5)*2;parallax.ty=(e.clientY/innerHeight-.5)*2;});
function toggleFs(){const d=document,el=d.documentElement;try{
  if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}
  else{const f=el.requestFullscreen||el.webkitRequestFullscreen; const r=f&&f.call(el); if(r&&r.catch) r.catch(()=>{});}}catch(e){}}
document.getElementById('fs').addEventListener('click',e=>{e.stopPropagation();toggleFs();});
document.getElementById('fs').addEventListener('pointerup',e=>e.stopPropagation());

function frame(noRender){
  const n=now();
  tweens=tweens.filter(t=>{const p=(n-t.t0)/t.dur; if(p<0) return true; const q=Math.min(1,p); t.fn(t.ease(q)); if(q>=1){t.done&&t.done();return false;} return true;});
  parallax.x+=(parallax.tx-parallax.x)*.05; parallax.y+=(parallax.ty-parallax.y)*.05;
  cam.position.x=parallax.x*.5; cam.position.y=-parallax.y*.3; cam.lookAt(0,0,0);
  const s=S[cur]; if(s&&s.tick&&group) s.tick.call(s,n-t0,group);
  if(!noRender) R.render(scene,cam);
}
function loop(){frame(); if(!window.__REC) requestAnimationFrame(loop);}
window.__deck={get group(){return group},R,scene,cam,frame,next,show,count:S.length,steps:i=>S[i].steps,preload:()=>Promise.all(['kanji-phone.jpg','chatgpt.png','gemini.png','claude.png','muse.png'].map(n=>loadImg('img/'+n)))};
const start=parseInt((location.hash.match(/^#s(\d+)$/)||[])[1]||'1',10)-1;
show(Math.min(Math.max(0,start),S.length-1)); loop();
})();
</script>
