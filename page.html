<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>講義・課題（発表用デモ）</title>
<style>
  body { margin: 0; font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif; color: #444; background: #fff; }
  .demo-note { background: #fff3cd; color: #6b5300; font-size: 12px; padding: 6px 12px; }
  .topline { height: 5px; background: #4a2a7a; }
  .bar { background: #6e9a63; color: #fff; padding: 14px 24px; font-size: 20px; letter-spacing: 2px; }
  main { padding: 24px; max-width: 760px; }
  .box { border: 2px dashed #bbb; padding: 40px 20px; text-align: center; color: #777; margin: 20px 0; }
  .back { display: inline-block; background: #999; color: #fff; padding: 6px 18px; text-decoration: none; font-weight: bold; }
</style>
</head>
<body>
<div class="demo-note">※ 発表用に作ったデモページです。実在のサービスではありません。</div>
<div class="topline"></div>
<div class="bar" id="bar"></div>
<main>
  <h2 id="title"></h2>
  <div class="box">このページの中身はまだ作っていません。<br>元のページのHTMLが届いたら、作りを真似して作ります（問題文は架空のものにします）。</div>
  <a class="back" href="tasks.html">← 戻る</a>
</main>
<script>
  var names = ['文学国語', '日本史探究', '政治・経済', '物理基礎', '体育Ⅲ', '英語コミュニケーションⅢ', '論理・表現Ⅰ'];
  var q = new URLSearchParams(location.search);
  var kind = q.get('t') === 'lecture' ? 'スクーリング（講義）' : '報告宿題';
  document.getElementById('bar').textContent = kind;
  document.getElementById('title').textContent = (names[q.get('s')] || '') + '　第' + (q.get('n') || '') + '回';
  document.title = kind + '（発表用デモ）';
</script>
</body>
</html>
